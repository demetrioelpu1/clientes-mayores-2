<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Recibiendo archivo…</title>
<meta name="theme-color" content="#17181c" />
<style>
  html, body {
    margin: 0; height: 100%; background: #17181c; color: #f2f2f2;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px;
  }
  .box { max-width: 320px; }
  .spinner {
    width: 34px; height: 34px; border: 3px solid #33343c; border-top-color: #f5822a;
    border-radius: 50%; margin: 0 auto 16px; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  p { font-size: 13.5px; color: #9a9a9f; line-height: 1.5; }
</style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <p id="msg">Recibiendo el archivo compartido…</p>
  </div>

  <script>
    // Este HTML solo se ve como respaldo si el Service Worker todavía no
    // interceptó el envío (por ejemplo, la primerísima vez que se comparte
    // algo antes de que la app se haya abierto una vez). En el flujo normal,
    // el Service Worker responde a este POST con una redirección directa a
    // index.html?sharedImport=1, así que esta página casi nunca se pinta.
    document.getElementById('msg').textContent =
      'No se pudo procesar el archivo automáticamente. Abre la app "Catastro Técnico-Comercial" una vez con internet, y vuelve a compartir el archivo — o usa el botón "Cargar archivo KMZ / KML" dentro de la app.';
    setTimeout(() => { window.location.href = './index.html'; }, 3500);
  </script>
</body>
</html>
